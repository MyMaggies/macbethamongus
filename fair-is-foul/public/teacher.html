<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fair Is Foul - Teacher</title>
<style>
:root{color-scheme:dark;--bg:#0d0b14;--panel:#1b1630;--edge:#5b4f8a;--ink:#f2e9d0;--dim:#a79fc0;--gold:#f5c04a;--green:#4cc16a;--red:#e2483f}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:20px/1.2 ui-monospace,Menlo,monospace}
h1{font-size:18px;color:var(--gold);margin:0 0 4px}p{color:var(--dim);margin:4px 0 12px;font-size:16px}
code{background:var(--panel);padding:2px 6px;border:1px solid var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.t{background:var(--panel);border:3px solid var(--edge);padding:10px 12px}
.t h2{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.ph{font-size:12px;padding:3px 7px;background:#29224a}.ph.play,.ph.meeting{background:#7a1c18}.ph.lobby{background:#29224a}.ph.over{background:#1d4a2b}
.t ul{list-style:none;margin:0 0 8px;padding:0;font-size:16px;min-height:5.5em}.t li{padding:1px 0}.t li.off{opacity:.4}.r{color:var(--green)}
button{font:inherit;font-size:13px;padding:8px 10px;border:2px solid #000;background:var(--gold);color:#1a1020;cursor:pointer;margin-right:6px}
button.g{background:#29224a;color:var(--ink)}
.msg{color:var(--dim);font-size:14px;min-height:1.2em;margin-top:6px}
</style></head><body>
<h1>FAIR IS FOUL: TEACHER VIEW</h1>
<p>Students open <code id="url"></code> and pick their table (A to D). This page refreshes every 3 seconds.</p>
<div class="grid" id="grid"></div>
<p>Start now ignores the READY buttons (use it if one student is stuck). Reset sends the table back to its lobby.</p>
<script>
var TABLES=['A','B','C','D'];
document.getElementById('url').textContent=location.origin;
function key(){var k='';try{k=localStorage.getItem('fif_tkey')||''}catch(e){}if(!k){k=prompt('Teacher password (see wrangler.toml)')||'';try{localStorage.setItem('fif_tkey',k)}catch(e){}}return k}
function esc(s){return String(s).replace(/[<>&"]/g,'')}
var grid=document.getElementById('grid');
TABLES.forEach(function(t){var d=document.createElement('div');d.className='t';d.id='t'+t;d.innerHTML='<h2>TABLE '+t+' <span class="ph" id="p'+t+'">...</span></h2><ul id="l'+t+'"></ul><button data-c="start" data-t="'+t+'">START NOW</button><button class="g" data-c="reset" data-t="'+t+'">RESET</button><div class="msg" id="m'+t+'"></div>';grid.appendChild(d)});
grid.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var t=b.dataset.t,c=b.dataset.c;
 fetch('/ctl/'+t+'?cmd='+c+'&key='+encodeURIComponent(key())).then(function(r){return r.text().then(function(x){document.getElementById('m'+t).textContent=x;if(r.status===403){try{localStorage.removeItem('fif_tkey')}catch(e){}}poll()})}).catch(function(){document.getElementById('m'+t).textContent='no connection'})});
function poll(){TABLES.forEach(function(t){fetch('/status/'+t,{cache:'no-store'}).then(function(r){return r.json()}).then(function(s){
 var p=document.getElementById('p'+t);p.textContent=s.phase.toUpperCase()+(s.round?' #'+s.round:'');p.className='ph '+s.phase;
 document.getElementById('l'+t).innerHTML=s.seats.length?s.seats.map(function(x){return '<li class="'+(x.online?'':'off')+'">'+esc(x.name)+(x.online&&x.ready?' <span class="r">READY</span>':'')+(x.online?'':' (offline)')+'</li>'}).join(''):'<li class="off">empty</li>'}).catch(function(){})})}
poll();setInterval(poll,3000);
</script></body></html>
