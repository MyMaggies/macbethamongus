<title>Crown of Ambition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one 16:10 pixel-art "screen" centred on a dark page. A deliberate single-look dark design
   (candlelit castle), so every colour is set explicitly and the page stays dark in either theme. */
:root{
  --bg:#0a0810; --bg2:#1a1226; --ink:#f2ead8; --dim:#9b8fb0; --gold:#e7b93a; --blood:#c4202e;
  --font-d:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 35%, var(--bg2) 0%, var(--bg) 72%) var(--bg);color:var(--ink);
  font-family:var(--font-d);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#wrap{height:100%;box-sizing:border-box;padding-inline:16px;padding-block:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#frame{padding:5px;background:#120d1c;border:2px solid #4a3a2a;border-radius:4px;
  box-shadow:0 0 0 2px #000,0 14px 44px rgba(0,0,0,.65),0 0 70px rgba(231,185,58,.10)}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none;touch-action:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#screen:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#hint{margin:0;font-size:8px;line-height:1.8;color:var(--dim);text-align:center;max-width:720px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<main id="wrap">
  <h1 class="sr">Macbeth: Crown of Ambition, a story adventure about Act 3</h1>
  <div id="frame"><canvas id="screen" tabindex="0" aria-label="Crown of Ambition game screen. Use arrow keys and space, or tap and swipe."></canvas></div>
  <p id="hint">ARROWS or WASD to walk &middot; SPACE to talk and choose &middot; J plot log &middot; M music</p>
</main>
<script>
(()=>{
'use strict';
/* =====================================================================
   1. BASICS
   ===================================================================== */
const W=384,H=240,SH=176,PY=SH;           // screen, scene height, panel top
const cv=document.getElementById('screen');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const FONT='"Press Start 2P",ui-monospace,Menlo,Consolas,monospace';
const INK='#f2ead8',DIM='#9b8fb0',GOLD='#e7b93a',BLOOD='#c4202e',EMBER='#e6762a',ICE='#7ec8e3',K='#14101c';
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;if(f)f(g);return c;};
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const hx=a=>'#'+a.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const shade=(h,f)=>hx(rgb(h).map(v=>v*f));
const mix=(a,b,t)=>{const A=rgb(a),B=rgb(b);return hx(A.map((v,i)=>lerp(v,B[i],t)));};
function disc(g,cx,cy,r){for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));g.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2,1);}}
function wrap(s,n){const out=[];let line='';for(const w of String(s).split(' ')){if((line+' '+w).trim().length>n){if(line)out.push(line);line=w;}else line=(line+' '+w).trim();}if(line)out.push(line);return out;}
function T(s,x,y,col=INK,size=8,align='left',sh='#000'){
  ctx.font=size+'px '+FONT;ctx.textBaseline='top';ctx.textAlign=align;
  if(sh){ctx.fillStyle=sh;ctx.fillText(s,x+1,y+1);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
let isTouch=false,time=0;
const store={get(k,d){try{const v=localStorage.getItem('crownAmbition');return v?(JSON.parse(v)[k]??d):d;}catch(e){return d;}},
  set(k,v){try{const o=JSON.parse(localStorage.getItem('crownAmbition')||'{}');o[k]=v;localStorage.setItem('crownAmbition',JSON.stringify(o));}catch(e){}}};

/* =====================================================================
   2. AUDIO (tiny synth, no files)
   ===================================================================== */
let AC=null,sfxOn=store.get('sfx',true),musicOn=false,mTimer=null,mStep=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='square',v=.04,at=0,f2=null,force=false){
  if(!sfxOn&&!force)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.06){if(!sfxOn)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(a.destination);s.start();}
const SFX={
  blip:()=>tone(240+Math.random()*30,.03,'triangle',.006),
  select:()=>tone(660,.05,'triangle',.035),
  move:()=>tone(440,.04,'triangle',.03),
  ok:()=>{[523,659,784].forEach((f,i)=>tone(f,.1,'square',.035,i*.07));},
  bad:()=>{tone(170,.3,'sawtooth',.05,0,70);},
  pick:()=>{[784,988,1319].forEach((f,i)=>tone(f,.09,'triangle',.05,i*.06));},
  hush:()=>{tone(110,.6,'sine',.03,0,70);},
  boom:()=>{tone(70,.9,'sawtooth',.07,0,32);noise(.6,.05);},
  sting:()=>{tone(220,.5,'sawtooth',.035,0,330);tone(233,.5,'sawtooth',.035,0,350);},
  up:()=>{[392,494,587].forEach((f,i)=>tone(f,.12,'triangle',.04,i*.06));},
  down:()=>{[587,494,392].forEach((f,i)=>tone(f,.12,'triangle',.04,i*.06));},
  door:()=>{noise(.25,.05);tone(90,.3,'square',.03,0,50);}
};
const MEL=[0,null,7,null,3,null,7,null,0,null,5,null,3,null,2,null,-2,null,5,null,2,null,5,null,0,null,3,null,2,null,-2,null];
function mStepPlay(){if(!musicOn)return;const i=mStep%MEL.length,m=MEL[i];
  if(m!==null)tone(110*Math.pow(2,m/12+1),.5,'triangle',.03,0,null,true);
  if(i%8===0)tone(55*Math.pow(2,(i%16===8?-2:0)/12),1.2,'sine',.05,0,null,true);mStep++;}
function setMusic(on){musicOn=on;clearInterval(mTimer);if(on){ac();mTimer=setInterval(mStepPlay,430);}}

/* =====================================================================
   3. PEOPLE  (all drawn in code: shaded 24x40 figures with an auto outline)
   ===================================================================== */
const LOOK={
  macbeth:{name:'MACBETH',skin:'#e3ae80',hair:'#3a2418',beard:'#2c1b12',robe:'#8c1d2c',trim:'#e7b93a',cloak:'#3c0d18',hose:'#2a2230',crown:1,fur:1,col:'#ff8a8a'},
  lady:{name:'LADY MACBETH',skin:'#f0cba8',hair:'#1c1220',hairStyle:'long',robe:'#5a3fb0',trim:'#e7b93a',gown:1,circlet:1,hose:'#2a2230',col:'#c9a6ff'},
  fleance:{name:'FLEANCE',kid:1,skin:'#f0c79c',hair:'#d0a24e',robe:'#2f8a4a',trim:'#d8c08a',cloak:'#6b4f2a',hose:'#5a4636',col:'#9af0b8'},
  banquo:{name:'BANQUO',skin:'#d9a97c',hair:'#8d8f99',beard:'#9a9ca6',robe:'#2e6a7e',trim:'#c9b05a',cloak:'#33465c',hose:'#2a2230',sword:1,col:'#8fd3e6'},
  steward:{name:'STEWARD',skin:'#e0b48a',hair:'#5a4a3a',hairStyle:'bald',robe:'#6a4a30',trim:'#c9a24a',gown:1,hose:'#3a2c20',col:'#e8cf9a'},
  m1:{name:'FIRST MURDERER',skin:'#b98a66',hood:'#2a2630',beard:'#1a1418',robe:'#3a3238',cloak:'#26222c',hose:'#241e26',col:'#c8c0d0'},
  m2:{name:'SECOND MURDERER',skin:'#c89874',hood:'#33292a',beard:'#241a14',robe:'#4a3a34',cloak:'#2c2224',hose:'#241e26',col:'#c8c0d0'},
  attendant:{name:'ATTENDANT',skin:'#e0b48a',hair:'#5a4a3a',hairStyle:'bald',robe:'#6a4a30',trim:'#c9a24a',gown:1,hose:'#3a2c20',col:'#e8cf9a'},
  servant:{name:'SERVANT',skin:'#e6bb94',hair:'#4a3a2a',robe:'#7a5a3a',trim:'#c9a24a',gown:1,hose:'#3a2c20',col:'#e8cf9a'},
  ross:{name:'ROSS',skin:'#dcae82',hair:'#6a4a2a',beard:'#5a3a22',robe:'#3a5a8a',trim:'#c9b05a',cloak:'#26364e',hose:'#2a2230',col:'#a8c8f0'},
  lennox:{name:'LENNOX',skin:'#e2b48a',hair:'#8a8a94',robe:'#4a7a4a',trim:'#c9b05a',cloak:'#2e4a30',hose:'#2a2230',col:'#b0e0b0'},
  duncan:{name:'DUNCAN',skin:'#e3b890',hair:'#dcdce6',beard:'#e8e8f0',robe:'#c9a640',trim:'#fff1b8',cloak:'#7a6a24',hose:'#2a2230',crown:1,fur:1,col:'#ffe08a'},
  guard:{name:'GUARD',skin:'#d9a97c',helmet:1,robe:'#6a2a2a',trim:'#c9a24a',hose:'#2a2230',spear:1,col:'#d8d8e0'},
  spy:{name:'A SPY',skin:'#b98a66',hood:'#1a1620',beard:'#1a1418',robe:'#2a2430',cloak:'#1c1822',hose:'#1c1822',col:'#c8c0d0'},
  m3:{name:'THIRD MURDERER',skin:'#a8805e',hood:'#2c2a34',beard:'#18121a',robe:'#32303a',cloak:'#201e28',hose:'#241e26',col:'#c8c0d0'},
  lord1:{name:'LORD',skin:'#e0b48a',hair:'#6a5a4a',beard:'#4a3a2a',robe:'#7a3a5a',trim:'#c9b05a',cloak:'#4a2238',hose:'#2a2230',col:'#e8b8d0'},
  lord2:{name:'LORD',skin:'#d9a97c',hair:'#9a9aa4',robe:'#3a5a7a',trim:'#c9b05a',cloak:'#26364e',hose:'#2a2230',col:'#b8d0e8'},
  lord:{name:'A LORD',skin:'#dcae82',hair:'#5a4a3a',beard:'#3a2a1c',robe:'#6a5a2a',trim:'#c9b05a',cloak:'#3e3418',hose:'#2a2230',col:'#e8d8a0'},
  ghost:{name:'GHOST OF BANQUO',skin:'#b8d0dc',hair:'#d8e4ec',beard:'#dce8f0',robe:'#6a8aa0',trim:'#c8e0f0',cloak:'#4a6478',hose:'#4a6478',sword:1,col:'#a8d8f0'},
  witch1:{name:'FIRST WITCH',skin:'#b8c89a',hair:'#2a2a2a',hairStyle:'long',hood:'#1e1a2a',robe:'#2e2440',trim:'#6a4a8a',gown:1,col:'#c8a8e8'},
  witch2:{name:'SECOND WITCH',skin:'#c0c4a0',hair:'#3a3a3a',hairStyle:'long',hood:'#221c30',robe:'#3a2a4a',trim:'#6a4a8a',gown:1,col:'#c8a8e8'},
  witch3:{name:'THIRD WITCH',skin:'#b4c294',hair:'#202020',hairStyle:'long',hood:'#1a1626',robe:'#2a2038',trim:'#6a4a8a',gown:1,col:'#c8a8e8'},
  hecate:{name:'HECATE',skin:'#d8c8e0',hair:'#101018',hairStyle:'long',hood:'#3a1a4a',robe:'#5a1a5a',trim:'#e7b93a',cloak:'#2a0e34',gown:1,circlet:1,col:'#ff9ad8'}
};
function personRaw(L,dir,fr){
  return mk(26,42,g=>{
    g.translate(1,1);
    const r=(c,x,y,w,h)=>R(g,c,x,y,w,h);
    const kid=!!L.kid,S=kid?3:0,walk=fr===1||fr===2,bob=walk?-1:0;
    const skin=L.skin,skinD=shade(skin,.8),skinL=shade(skin,1.08);
    const robe=L.robe,robeL=shade(robe,1.28),robeD=shade(robe,.72),trim=L.trim||GOLD;
    const hair=L.hair||'#333',hairD=shade(hair,.7),hairL=shade(hair,1.25);
    const boot='#2a1c14',bootL='#4a3322';
    const side=dir==='r'||dir==='l',back=dir==='u';
    const tY=14+S,hY=3+S;
    const liftA=fr===1?2:0,liftB=fr===2?2:0;
    // ---- legs and boots (not for long gowns)
    if(!L.gown){
      const hose=L.hose||'#2a2230';
      if(!side){
        r(hose,7,27+S,4,9-liftA-S+0);r(boot,6,35-liftA,5,4);r(bootL,6,35-liftA,1,3);
        r(hose,13,27+S,4,9-liftB-S+0);r(boot,13,35-liftB,5,4);r(bootL,13,35-liftB,1,3);
      }else{
        const fa=fr===1?3:fr===2?-3:0;
        r(shade(hose,.8),9-fa,27+S,4,9-S);r(shade(boot,.8),8-fa,35,6,4);
        r(hose,10+fa,27+S,4,9-S);r(boot,9+fa,35,7,4);r(bootL,10+fa,35,5,1);
      }
    }
    g.save();g.translate(0,bob);
    // ---- cloak behind
    if(L.cloak&&!side){r(L.cloak,3,tY,18,L.gown?20:19);r(shade(L.cloak,1.3),3,tY,2,19);r(shade(L.cloak,.7),18,tY,3,19);r(shade(L.cloak,.55),3,tY+19,18,1);}
    if(L.cloak&&side){r(L.cloak,dir==='r'?4:12,tY,10,22);r(shade(L.cloak,.7),dir==='r'?4:12,tY+8,10,14);}
    // ---- long gown skirt
    if(L.gown){
      const sw=(fr===1?1:fr===2?-1:0);
      for(let i=0;i<24-S;i++){
        const y=tY+13+i-0,w=side?10+Math.floor(i/4):14+Math.floor(i/3);const x0=Math.round(12-w/2+(i>12?sw*(i-12)/6:0));
        if(y>38)break;
        r(robe,x0,y,w,1);r(robeL,x0,y,Math.max(1,Math.floor(w/5)),1);r(robeD,x0+w-Math.max(2,Math.floor(w/4)),y,Math.max(2,Math.floor(w/4)),1);
        if(i%5===2&&w>10){r(robeD,x0+Math.floor(w*.4),y,1,1);r(robeD,x0+Math.floor(w*.7),y,1,1);}
      }
      r(trim,6,37,12,1);
    }
    // ---- torso
    if(!side){
      r(robe,5,tY,14,13);r(robeL,5,tY,2,13);r(robeD,16,tY,3,13);
      if(L.centerTrim||L.crown){r(trim,11,tY+2,2,11);}
      if(L.fur){r('#efe9dc',6,tY,12,3);for(let i=0;i<5;i++)r('#14101c',7+i*2,tY+1+(i%2),1,1);}
      else r(trim,8,tY,8,1);
      r('#241812',5,tY+9,14,2);r(trim,11,tY+9,2,2);
      if(L.sword&&!back){r('#aeb6c4',1,tY+10,1,10);r(trim,0,tY+9,3,1);r('#6a4a2a',1,tY+7,1,2);}
      // arms
      const sl=L.sleeve||robe;
      r(shade(sl,.95),3,tY+1,3,10);r(shade(sl,.7),3,tY+1,1,10);r(skin,3,tY+11,3,2);
      r(shade(sl,.8),18,tY+1,3,10);r(skin,18,tY+11,3,2);
      if(L.spear){r('#6b4a2a',22,2,1,38);r('#cfd3dc',21,0,3,3);}
    }else{
      const fx=dir==='r'?1:-1,xo=dir==='r'?7:6;
      r(robe,xo,tY,10,13);r(robeD,dir==='r'?xo:xo+8,tY,2,13);r(robeL,dir==='r'?xo+7:xo,tY,2,13);
      if(L.fur){r('#efe9dc',xo,tY,10,3);}else r(trim,xo,tY,10,1);
      r('#241812',xo,tY+9,10,2);
      const swing=fr===1?2:fr===2?-2:0;
      const ax=dir==='r'?10+swing:10-swing;
      r(shade(L.sleeve||robe,.85),ax,tY+1,4,10);r(skin,ax,tY+11,4,2);
      if(L.sword){r('#aeb6c4',dir==='r'?6:17,tY+10,1,10);r(trim,dir==='r'?5:16,tY+9,3,1);}
      if(L.spear){r('#6b4a2a',dir==='r'?15:9,2,1,38);r('#cfd3dc',dir==='r'?14:8,0,3,3);}
    }
    // ---- neck
    if(!side)r(skinD,10,tY-2,4,2);else r(skinD,dir==='r'?10:12,tY-2,4,2);
    // ---- head
    if(back){
      r(skin,7,hY+1,10,9);r(hair,7,hY-1,10,10);r(hairD,7,hY+6,10,3);r(hairL,9,hY,3,2);
      if(L.hairStyle==='long'){r(hair,6,hY+2,12,17);r(hairD,6,hY+10,12,9);}
      if(L.hairStyle==='bald'){r(skin,7,hY-1,10,5);r(skinD,7,hY+4,10,5);}
      if(L.hood){r(L.hood,6,hY-1,12,13);r(shade(L.hood,.7),6,hY+7,12,5);}
      if(L.helmet){r('#8a8f9a',6,hY-1,12,7);r('#5a5f6a',6,hY+5,12,2);}
    }else if(!side){
      r(skin,8,hY,8,11);r(skin,7,hY+2,10,7);r(skinD,15,hY+2,2,8);r(skinL,8,hY+1,1,5);
      r('#1b1220',9,hY+5,2,2);r('#1b1220',13,hY+5,2,2);r('#fff',9,hY+5,1,1);r('#fff',13,hY+5,1,1);
      if(!L.beard)r('#a9503e',11,hY+8,2,1);
      if(L.hairStyle==='bald'){r(skin,7,hY-1,10,3);r(hair,6,hY+2,2,3);r(hair,16,hY+2,2,3);}
      else if(L.hairStyle==='long'){r(hair,7,hY-1,10,3);r(hair,6,hY+2,3,17);r(hair,15,hY+2,3,17);r(hairL,7,hY-1,3,1);r(hairD,15,hY+6,3,13);r(hair,9,hY,6,2);}
      else{r(hair,7,hY-1,10,3);r(hair,7,hY+2,2,3);r(hair,15,hY+2,2,3);r(hairL,8,hY-1,4,1);r(hair,8,hY+1,3,1);if(kid)r(hair,6,hY+1,1,4);}
      if(L.beard){r(L.beard,8,hY+7,8,4);r(shade(L.beard,1.3),9,hY+7,6,1);r('#a9503e',11,hY+8,2,1);r(skin,9,hY+6,6,1);r(L.beard,8,hY+3,1,5);r(L.beard,15,hY+3,1,5);}
      if(L.hood){r(L.hood,6,hY-1,12,5);r(L.hood,6,hY+3,3,10);r(L.hood,15,hY+3,3,10);r('#0c0810',8,hY+3,8,2);r(shade(L.hood,.6),7,hY+8,10,5);if(L.beard)r(L.beard,9,hY+8,6,3);}
      if(L.helmet){r('#8a8f9a',6,hY-2,12,5);r('#b5bac4',7,hY-2,4,1);r('#5a5f6a',6,hY+2,12,1);r('#6a6f7a',11,hY+3,2,5);}
    }else{
      const m=dir==='r',x0=m?8:8,nose=m?16:7;
      r(skin,8,hY,8,11);r(skinD,m?8:13,hY+2,3,8);
      r(skin,nose,hY+6,1,2);
      const ex=m?13:10;r('#1b1220',ex,hY+5,1,2);r('#fff',ex+(m?-1:1),hY+5,1,1);
      if(L.hairStyle==='bald'){r(hair,m?7:13,hY+3,4,3);}

function update(dt){

  toasts.forEach(q=>q.t+=dt);toasts=toasts.filter(q=>q.t<2.6);
  if(shake>0)shake=Math.max(0,shake-dt*14);
  if(G&&G.flash>0)G.flash=Math.max(0,G.flash-dt*2.2);
  if(mode==='crawl'){crawlT+=dt;if(crawlT*CRAWL_SPD>crawlEnd()+20){mode='hero';SFX.select();}return;}
  if(mode!=='play'||!G)return;
  updateArena(dt);
  if(hitstop>0){hitstop-=dt;return;}
  G.ambShown+=(G.amb-G.ambShown)*Math.min(1,dt*3);
  const hero=A(G.hero);
  // keyboard walking while exploring
  if(ui&&ui.a==='explore'&&!journal&&hero&&!isFeast()){
    const vx=keys.r-keys.l,vy=keys.d-keys.u;
    if(vx||vy){const t=goFloor(hero.x+vx*16,hero.y+vy*12);hero.tx=t[0];hero.ty=t[1];hero.spd=62;ui.pend=null;hero.kb=true;}
    else if(hero.kb){hero.tx=hero.ty=null;hero.kb=false;}
  }
  if(!journal)for(const a of Object.values(G.actors))moveActor(a,dt);
  if(ui&&(ui.a==='choose'||ui.a==='explore'||ui.a==='type'||ui.a==='fill')&&!journal&&!G.off&&!G.over){G.amb=Math.max(0,G.amb-dt*dscale()*(ui.a==='explore'?DRAIN_EXPLORE:(ui.a==='type'||ui.a==='fill')?DRAIN_TYPE:DRAIN_CHOOSE));}
  if(G.amb<=0&&!G.off&&!G.over&&mode==='play'&&!(ui&&ui.a==='pop')){G.over=1;gen=null;ui=null;G.explore=null;tin.blur();run(offScript(G.hero==='macbeth'?'guilt_m':'guilt_l',G.hero==='macbeth'?'You ran out of time. Guilt wore his ambition away.':'You ran out of time. The queen\'s mask slipped.'));return;}
  if(!ui||journal)return;
  switch(ui.a){
    case 'say':{
      ui.t+=dt;const before=Math.floor(ui.shown);ui.shown+=dt*46;
      if(Math.floor(ui.shown/8)!==Math.floor(before/8)&&ui.shown<ui.pages[ui.i].join(' ').length)SFX.blip();
      break;}
    case 'gallery':galUpdate(dt);break;
    case 'fight':if(F.msgT>0)F.msgT-=dt;if(F.phase==='last')updateLast(dt);updateFight(dt);break;
    case 'wait':ui.d-=dt;if(ui.d<=0)done();break;
    case 'fill':{ui.t+=dt;if(ui.miss>0)ui.miss-=dt;if(ui.res){ui.rt+=dt;if(ui.rt>1.4)done(ui.tries===0);}break;}
    case 'type':{ui.t+=dt;if(ui.miss>0)ui.miss-=dt;if(ui.res){ui.rt+=dt;if(ui.rt>1.6){tin.blur();done(ui.res==='ok');}}break;}
    case 'walk':{if(ui.m.every(m=>A(m.id).tx==null))done();break;}
    case 'fade':fade.to=ui.to;if(Math.abs(fade.a-ui.to)<.02)done();break;
    case 'card':ui.t+=dt;if(ui.t>3.4)done();break;
    case 'pop':ui.t+=dt;if(ui.t>5)done();break;
    case 'warn':{const b=Math.floor(ui.t*2.5);ui.t+=dt;if(Math.floor(ui.t*2.5)!==b)SFX.bad();if(ui.t>4)done();break;}
    case 'cinema':{ui.t+=dt;if(ui.t>.9)ui.shown+=dt*21;break;}
    case 'explore':{
      if(isFeast()){const o=feastOrder(ui);if(!ui.near||o.indexOf(ui.near)<0)ui.near=o[0]||null;break;}
      ui.near=nearestHS(ui);
      if(ui.pend&&hero.tx==null){const h=ui.pend;ui.pend=null;done(h.id);}
      break;}
  }
}

function* offScript(key,note){
  yield {a:'warn'};
  G.off=true;
  yield* ENDINGS[key].beats();
  yield {a:'end',alt:key,note:note||null};
}

const OFFKEY=null;

/* ---------- the meter: right words give a small boost, the weight of the deed wears it down ---------- */
const BOOST=30,WASTE=6;
function right(){amb(BOOST,'Right words');G.right=(G.right||0)+1;}
function weigh(){}
function waste(){G.amb=Math.max(0,G.amb-WASTE);toast('TIME WASTED -'+WASTE,ICE);SFX.down();}
/* free-roam: go to the right person. The others are in the room but have nothing for you, and each costs time. */
const HS={
  ross:{id:'ross',name:'ROSS',verb:'speak to Ross',npc:'ross'},
  lennox:{id:'lennox',name:'LENNOX',verb:'speak to Lennox',npc:'lennox'},
  attendant:{id:'attendant',name:'ATTENDANT',verb:'speak to the attendant',npc:'attendant'},
  banquo:{id:'banquo',name:'BANQUO',verb:'speak to Banquo',npc:'banquo'},
  lady:{id:'lady',name:'THE QUEEN',verb:'speak to your wife',npc:'lady'},
  macbeth:{id:'macbeth',name:'THE KING',verb:'speak to your husband',npc:'macbeth'}
};
function* approach(objective,ids,target,react){
  const hs=ids.map(i=>HS[i]);
  for(const h of hs)delete G.flags['seen_'+h.id];
  while(true){
    const id=yield explore({hs,objective,target});
    if(id===target)return;
    G.flags['seen_'+id]=1;
    yield narr(react[id]);
    waste();
  }
}
const NOTHING={
  ross:'Ross bows his head and says nothing. He has no business with you now.',
  lennox:'Lennox bows and waits. He has nothing to tell you.',
  attendant:'The attendant waits with his eyes on the floor. This is not the moment.'};
/* two steps: say what you want in plain English, then say it the way the play does */
function* two(hero,n){
  const p=yield* pick(n.prompt,n.plain);
  if(!p.ok)yield* offScript(p.off,p.note);
  const r=yield* pick(n.prompt2||'Now say it as the play does:',n.real);
  if(!r.ok)yield* offScript(r.off,r.note);
  right();weigh();G.said.push(r.t);
  if(n.spoken)yield say(hero,n.spoken);
}
/* one step: match a thought, or something you noticed, to the play's words */
function* one(hero,n){
  const r=yield* pick(n.prompt,n.real);
  if(!r.ok)yield* offScript(r.off,r.note);
  right();weigh();G.said.push(r.t);
  if(n.spoken)yield say(hero,n.spoken);
}
/* typed recall: finish a line of the play from memory. Three tries, and each miss costs time. */
function* recall(hero,n){
  const opts=[{t:n.gap,ok:1}].concat((n.bad||['',' ']).map(t=>({t})));
  const ord=window.__noShuffle?opts:shuf(opts);
  if(LEVEL==='hard'){const t=yield typeq({prompt:n.prompt||'Finish the line from memory.',line:n.line,gap:n.gap});if(t){right();G.said.push(n.gap);G.typed=(G.typed||0)+1;}return;}
  const ok=yield fillq({prompt:n.prompt||'Pick the words that finish the line.',line:n.line,gap:n.gap,opts:ord});
  if(ok){right();G.said.push(n.gap);G.typed=(G.typed||0)+1;}
}
/* a clue: the student must pick what the last speech told them. The notebook fills in only when they are right. */
function* clue(i,prompt,good,note,bad1,bad2){
  const r=yield* pick(prompt,[ok(good),bad1,bad2]);
  right();G.said.push(note);fact(i,note);
}
/* one plain-English question about WHY. Understanding, not memory. */
function* plainOne(n){
  const r=yield* pick(n.prompt,n.plain);

  right();G.said.push(n.said||r.t);
}
